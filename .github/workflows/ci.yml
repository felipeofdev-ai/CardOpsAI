name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sqlfluff
      - run: sqlfluff lint database engines snapshots stress compliance --dialect postgres || true

  test:
    runs-on: ubuntu-latest
    needs: lint-sql
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cardops_db
          POSTGRES_USER: cardops
          POSTGRES_PASSWORD: cardops_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardops -d cardops_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CARDOPS_DSN: postgresql://cardops:cardops_secret@localhost:5432/cardops_db
      CARDOPS_SCHEMA_LOADED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load schema once
        run: bash scripts/load_all_sql.sh
      - run: pytest -q tests

  api-smoke:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cardops_db
          POSTGRES_USER: cardops
          POSTGRES_PASSWORD: cardops_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardops -d cardops_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CARDOPS_DSN: postgresql://cardops:cardops_secret@localhost:5432/cardops_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash scripts/load_all_sql.sh
      - run: |
          python cardops_api.py &
          sleep 3
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/api/v1/metrics/prometheus | head
