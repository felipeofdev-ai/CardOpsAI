services:
  postgres:
    image: postgres:17-alpine
    container_name: cardops-postgres
    environment:
      POSTGRES_DB: cardops_db
      POSTGRES_USER: cardops
      POSTGRES_PASSWORD: cardops_secret
    ports:
      - "5432:5432"
    volumes:
      - cardops_pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardops -d cardops_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer
    container_name: cardops-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cardops_pgdata:
